plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

android {
    namespace 'com.seif.emojis.keyboard'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    defaultConfig {
        applicationId 'com.seif.emojis.keyboard'
        // Android 5.0 (Lollipop) and newer, subject to library/device compatibility.
        minSdk 21
        // Raise target SDK so modern Android treats the app as less outdated.
        targetSdk 34
        versionCode 4
        versionName '1.0.3'
    }
}
