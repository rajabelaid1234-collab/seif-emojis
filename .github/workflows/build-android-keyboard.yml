name: Build SEIF EMOJIS Android Keyboard

on:
  push:
    paths:
      - 'android-keyboard/**'
      - 'index.html'
      - '.github/workflows/build-android-keyboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Download the existing website icon
        run: |
          mkdir -p android-keyboard/app/src/main/res/drawable-nodpi
          curl -fLsS --retry 3 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgg0E8QbJBCvTLNEzX5fR3GCwk5DVA7d0EuidDE-5qbw&s=10' -o /tmp/seif-site-icon
          python3 -m pip install --quiet Pillow
          python3 -c "from PIL import Image; im=Image.open('/tmp/seif-site-icon').convert('RGBA'); im.save('android-keyboard/app/src/main/res/drawable-nodpi/seif_site_icon.png'); im.save('android-keyboard/app/src/main/assets/site-icon.png')"
      - name: Bundle the same website and offline face-analysis model
        run: |
          mkdir -p android-keyboard/app/src/main/assets/models
          cp index.html android-keyboard/app/src/main/assets/index.html
          curl -fLsS --retry 3 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/build/face-api.min.js' -o android-keyboard/app/src/main/assets/face-api.min.js
          for file in tiny_face_detector_model-weights_manifest.json tiny_face_detector_model-shard1 face_expression_model-weights_manifest.json face_expression_model-shard1; do
            curl -fLsS --retry 3 "https://justadudewhohacks.github.io/face-api.js/models/$file" -o "android-keyboard/app/src/main/assets/models/$file"
          done
      - name: Build APK
        working-directory: android-keyboard
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seif-emojis-keyboard-android
          path: android-keyboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish downloadable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-keyboard-v1.0.${{ github.run_number }}
          name: SEIF EMOJIS Keyboard Android v1.0.${{ github.run_number }}
          body: |
            Android keyboard prototype for SEIF EMOJIS.
            Download app-debug.apk and install it on your Android device.
            After installation, open the app and enable the keyboard in Android settings.
          files: android-keyboard/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
