<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>رموز تعبيرية سيف | SEIF EMOJIS</title>
<style>
:root{color-scheme:dark;--bg:#0d1020;--panel:#181d34;--line:#343d5c;--text:#f7f7ff;--muted:#b8c0dc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#38275b,transparent 50%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1150px,94%);margin:auto;padding:24px 0}header{text-align:center;padding:22px 0}.logo{font-size:clamp(2rem,6vw,3.7rem);background:linear-gradient(90deg,#5eead4,#c4b5fd,#f9a8d4);color:transparent;background-clip:text;margin:0}p{color:var(--muted);line-height:1.8}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}button,input{font:inherit;border:1px solid var(--line);border-radius:11px;padding:11px;background:#222944;color:var(--text)}button{cursor:pointer}button:hover{border-color:#a78bfa}.bar,.cats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.bar input{flex:1;min-width:180px;background:#10152a}.active{background:#7655df}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.card{position:relative;background:#222944;border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;min-height:95px}.face{font-size:1.3rem;direction:ltr;unicode-bidi:plaintext}.label{font-size:.8rem;color:var(--muted);margin-top:8px}.fav{position:absolute;top:4px;left:4px;padding:3px 7px}.notice{color:#5eead4;min-height:24px}.hidden{display:none}@media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.panel{padding:12px}}
</style></head><body><main class="wrap">
<header><h1 class="logo">✨ رموز تعبيرية سيف ✨</h1><p>مكتبة الإيموجيات اليابانية والرموز النصية<br>اضغط على أي بطاقة لنسخ الرمز 💜</p></header>
<section class="panel"><h2>🎭 مكتبة الإيموجيات</h2><div class="bar"><input id="search" placeholder="🔎 ابحث عن عناق، حب، ضحك..."><button id="favorites">⭐ المفضلة فقط</button><button id="copyall">📋 نسخ النتائج</button></div><div id="cats" class="cats"></div><div id="grid" class="grid"></div><p id="notice" class="notice"></p></section>
<section class="panel"><h2>➕ أضف رمزك الخاص</h2><div class="bar"><input id="newemoji" placeholder="الرمز النصي مثل (づ ◕‿◕ )づ"><input id="newlabel" placeholder="اسم الرمز"><input id="newcat" placeholder="التصنيف"><button id="add">حفظ</button></div><p class="notice">إضافاتك تُحفظ محليًا في هذا المتصفح. استخدم تصدير النسخة الاحتياطية لحفظها.</p><button id="backup">⬇ تصدير النسخة الاحتياطية</button><label><input type="file" id="restore" accept="application/json"></label></section>
<footer><p>SEIF EMOJIS 💜</p></footer></main>
<script>
(function(){
const seed=[
['عناق','⊂（♡⌂♡）⊃','عناق حب'],['عناق','⊂(◉‿◉)つ','عناق سعيد'],['عناق','⊂(・﹏・⊂)','عناق حزين'],['عناق','ლ(・ヮ・ლ)','تعال إلى هنا'],['عناق','(つ◉益◉)つ','عناق حماسي'],['عناق','⊂(・ヮ・⊂)','عناق لطيف'],['عناق','⊂(・▽・⊂)','عناق فرح'],['عناق','(っಠ‿ಠ)っ','عناق مشاكس'],['عناق','ʕっ•ᴥ•ʔっ','عناق دب'],['عناق','（っ・∀・）っ','عناق ودود'],['عناق','(づ￣ ³￣)づ','قبلة عناق'],['عناق','(つ´∀｀)つ','عناق كبير'],['عناق','(っ´▽｀)っ','عناق مبتسم'],['حب','♥‿♥','عيون حب'],['حب','♡＾▽＾♡','قلب وفرح'],['حب','(ღ˘⌣˘ღ)','محبة'],['قبلات','( ˘ ³˘)♥','قبلة حب'],['فرح','＼(^o^)／','فرح واحتفال'],['فرح','ヽ(＾Д＾)ﾉ','ضحكة سعيدة'],['فرح','ヾ(≧▽≦*)o','فرح كبير'],['حزن','(╥﹏╥)','بكاء'],['حزن','(ಥ﹏ಥ)','دموع'],['غضب','(ノಠ益ಠ)ノ','غاضب جدًا'],['لطافة','≽^•⩊•^≼','قط لطيف'],['لطافة','ʕ•ᴥ•ʔ','دب صغير'],['رموز','♡','قلب أبيض'],['رموز','𐙚','زخرفة'],['رموز','✩','نجمة'],['حيوانات','🐰','أرنب'],['حيوانات','🐈‍⬛','قط أسود'],['شائعة','🌸','زهرة'],['شائعة','✨','لمعان'],['شائعة','🔥','نار'],['شائعة','💕','قلوب'],['شائعة','👑','تاج'],['شائعة','❤️','قلب أحمر'],['شائعة','😭','بكاء'],['شائعة','🌹','وردة'],['شائعة','😂','ضحك'],['شائعة','💜','قلب بنفسجي'],['شائعة','🎥','كاميرا فيديو']
].map((x,i)=>({id:'s'+i,category:x[0],emoji:x[1],label:x[2]}));
const $=id=>document.getElementById(id);let items=seed,favs=new Set(),cat='الكل',onlyFav=false;
try{let saved=JSON.parse(localStorage.getItem('seifEmojiItems')||'null');if(Array.isArray(saved)&&saved.length)items=saved;favs=new Set(JSON.parse(localStorage.getItem('seifEmojiFavs')||'[]'));}catch(e){}
function save(){localStorage.setItem('seifEmojiItems',JSON.stringify(items));localStorage.setItem('seifEmojiFavs',JSON.stringify(Array.from(favs)));}
function msg(s){$('notice').textContent=s;setTimeout(()=>$('notice').textContent='',2400);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function copy(s){try{await navigator.clipboard.writeText(s);msg('تم النسخ بنجاح ✅');}catch(e){let t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();msg('تم النسخ بنجاح ✅');}}
function visible(){let q=$('search').value.toLowerCase().trim();return items.filter(x=>(cat==='الكل'||x.category===cat)&&(!onlyFav||favs.has(x.id))&&(x.emoji+' '+x.label+' '+x.category).toLowerCase().includes(q));}
function render(){let cats=['الكل',...new Set(items.map(x=>x.category))];$('cats').innerHTML=cats.map(c=>'<button class="'+(c===cat?'active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('');$('grid').innerHTML=visible().map(x=>'<div class="card" data-id="'+esc(x.id)+'"><button class="fav" data-fav="'+esc(x.id)+'">'+(favs.has(x.id)?'❤️':'🤍')+'</button><div class="face">'+esc(x.emoji)+'</div><div class="label">'+esc(x.label)+'</div></div>').join('');}
$('cats').addEventListener('click',e=>{let b=e.target.closest('[data-cat]');if(b){cat=b.dataset.cat;render();}});$('grid').addEventListener('click',e=>{let f=e.target.closest('[data-fav]');if(f){favs.has(f.dataset.fav)?favs.delete(f.dataset.fav):favs.add(f.dataset.fav);save();render();return;}let c=e.target.closest('[data-id]');if(c){let x=items.find(y=>y.id===c.dataset.id);if(x)copy(x.emoji);}});$('search').addEventListener('input',render);$('favorites').addEventListener('click',()=>{onlyFav=!onlyFav;$('favorites').textContent=onlyFav?'عرض الكل':'⭐ المفضلة فقط';render();});$('copyall').addEventListener('click',()=>copy(visible().map(x=>x.emoji).join('\n')));
$('add').addEventListener('click',()=>{let emoji=$('newemoji').value.trim(),label=$('newlabel').value.trim(),category=$('newcat').value.trim()||'متنوعة';if(!emoji){msg('اكتب الرمز أولًا.');return;}items.unshift({id:'u'+Date.now(),emoji,label:label||emoji,category});save();cat=category;render();$('newemoji').value='';$('newlabel').value='';$('newcat').value='';msg('تمت إضافة الرمز ✨');});
$('backup').addEventListener('click',()=>{let b=new Blob([JSON.stringify({items:items,favs:Array.from(favs)},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='seif-emojis-backup.json';a.click();URL.revokeObjectURL(u);});
$('restore').addEventListener('change',async e=>{try{let d=JSON.parse(await e.target.files[0].text());items=d.items||d;favs=new Set(d.favs||[]);save();render();msg('تم استيراد النسخة الاحتياطية.');}catch(err){msg('الملف غير صالح.');}});
render();
})();
</script></body></html>
